# EAH — Lefthook (3-Stage Quality Gate)
# ═══════════════════════════════════════════════════════════
# Pre-commit: سريع (1-3s) — فحص staged files بس
# Pre-push:  متوسط (6-8s) — typecheck كامل
# GitHub Actions: شامل (2-5 min) — tests + secrets + كل حاجة
# ═══════════════════════════════════════════════════════════

pre-commit:
  parallel: true
  commands:
    # secrets (سريع جداً — 0.4s)
    secrets:
      run: gitleaks protect --staged --redact --no-banner

    # prettier على الملفات المعدلة
    prettier:
      root: "web/"
      glob: "**/*.{ts,tsx,css,json}"
      run: npx prettier --check {staged_files}

    # stylelint على ملفات CSS المعدلة
    stylelint:
      root: "web/"
      glob: "**/*.module.css"
      run: npx stylelint {staged_files}

    # eslint على الملفات المعدلة
    eslint:
      root: "web/"
      glob: "**/*.{ts,tsx}"
      run: npx eslint {staged_files}

pre-push:
  commands:
    # typecheck كامل (الفحص البطيء الوحيد)
    typecheck:
      root: "web/"
      run: npx tsc --noEmit


# ═══════════════════════════════════════════════════════════
# Commit Message Convention
# ═══════════════════════════════════════════════════════════
commit-msg:
  commands:
    commitlint:
      root: "web/"
      run: npx commitlint --edit {1}
