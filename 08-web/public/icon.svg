<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161028"/>
      <stop offset="100%" stop-color="#06040C"/>
    </linearGradient>
    <linearGradient id="crown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="45%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E9D5FF"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect x="3" y="3" width="122" height="122" rx="25" fill="none" stroke="#A855F7" stroke-opacity="0.55" stroke-width="2"/>

  <!-- Crown -->
  <g filter="url(#glow)">
    <path d="M28 52 L20 30 L42 40 L64 18 L86 40 L108 30 L100 52 L100 62 L28 62 Z"
          fill="url(#crown)" stroke="#FFFBEB" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="30" y="60" width="68" height="8" rx="3"
          fill="url(#crown)" stroke="#FFFBEB" stroke-width="0.8"/>
    <circle cx="64" cy="20" r="4" fill="#E879F9" stroke="#FFFBEB" stroke-width="1"/>
    <circle cx="20" cy="32" r="3" fill="#E879F9" stroke="#FFFBEB" stroke-width="0.8"/>
    <circle cx="108" cy="32" r="3" fill="#E879F9" stroke="#FFFBEB" stroke-width="0.8"/>
  </g>

  <!-- EAH wordmark -->
  <text x="64" y="104"
        text-anchor="middle"
        font-family="Cairo, 'Segoe UI', Arial, Helvetica, sans-serif"
        font-size="42"
        font-weight="900"
        letter-spacing="0.5"
        fill="url(#neon)"
        stroke="#A855F7"
        stroke-width="0.8"
        stroke-opacity="0.7">EAH</text>
</svg>
