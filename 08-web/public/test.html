<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EAH Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #050308;
  }

  .stage {
    position: relative;
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo {
    position: relative;
    z-index: 1;
    width: 480px;
    max-width: 85vw;
    aspect-ratio: 2 / 1;
    cursor: pointer;
  }

  /* ===== هالة نيون بسيطة خلف الكلمة ===== */
  .word-glow {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    /* بيضاوي بنفسجي ناعم ورا الكلمة */
    background: radial-gradient(
      ellipse 55% 45% at 50% 55%,
      rgba(107, 33, 255, 0.35) 0%,
      rgba(107, 33, 255, 0.15) 30%,
      transparent 65%
    );
    filter: blur(20px);
  }

  .word {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    filter:
      drop-shadow(0 0 4px rgba(168, 85, 247, 0.35))
      drop-shadow(0 0 10px rgba(107, 33, 255, 0.18));
  }

  /* ===== التاج — من غير نيون ===== */
  .crown {
    position: absolute;
    left: 22%;
    top: -22%;
    width: 175px;
    height: auto;
    transform-origin: 50% 100%;
    transform: translate(-50%, 0) rotate(-14deg);
    transition:
      left 700ms cubic-bezier(0.34, 1.2, 0.64, 1),
      top 700ms cubic-bezier(0.34, 1.2, 0.64, 1),
      transform 700ms cubic-bezier(0.34, 1.2, 0.64, 1);
    pointer-events: none;
    z-index: 2;
    will-change: left, top, transform;
    /* نيون التاج اتشال */
  }

  .logo:hover .crown {
    left: 50%;
    top: -28%;
    transform: translate(-50%, 0) rotate(0deg);
  }

  .slogan {
    position: absolute;
    left: 50%;
    bottom: -12%;
    transform:
      translate(calc(-50% - 30px), 28px)
      rotate(-9deg)
      scale(0.9);
    opacity: 0;
    pointer-events: none;
    white-space: nowrap;
    font-family: 'Cairo', system-ui, sans-serif;
    font-weight: 900;
    font-size: 1.55rem;
    letter-spacing: 0.01em;
    color: #E8C79A;
    text-shadow:
      0 0 8px rgba(232, 199, 154, 0.45),
      0 0 18px rgba(168, 85, 247, 0.22);
    transform-origin: 50% 100%;
    transition:
      opacity 550ms cubic-bezier(0.34, 1.2, 0.64, 1) 100ms,
      transform 650ms cubic-bezier(0.34, 1.2, 0.64, 1) 100ms;
    will-change: opacity, transform;
    z-index: 3;
  }

  .slogan .punct {
    display: inline-block;
    color: #A855F7;
    font-weight: 900;
    text-shadow:
      0 0 8px rgba(168, 85, 247, 0.85),
      0 0 18px rgba(168, 85, 247, 0.5);
    transform: translateY(-0.04em);
  }

  .logo:hover .slogan {
    opacity: 1;
    transform:
      translate(calc(-50% - 25px), -6px)
      rotate(-3deg)
      scale(1.05);
  }

  @media (prefers-reduced-motion: reduce) {
    .crown, .slogan { transition: none; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="logo">
      <div class="word-glow"></div>
      <img class="word" src="/eah-word.webp" alt="EAH">
      <img class="crown" src="/eah-crown.webp" alt="">
      <div class="slogan">
        <span>اللى نفسك فيه</span>
        <span class="punct">؟</span>
      </div>
    </div>
  </div>
</body>
</html>
