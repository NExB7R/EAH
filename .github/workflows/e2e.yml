name: E2E

on:
  push:
    branches: [main, v2]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - 'web/scripts/ignore-vercel-build.sh'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - 'web/scripts/ignore-vercel-build.sh'
  workflow_dispatch:
    inputs:
      preview_url:
        description: 'Manual URL override (optional, HTTPS .vercel.app, not production)'
        required: false
        type: string

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # ── Cache Playwright browsers (~150MB) ──
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: pw-chrome-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            pw-chrome-${{ runner.os }}-

      - name: Install deps
        working-directory: web
        run: npm ci

      - name: Install Chrome for Playwright
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: npx playwright install --with-deps chrome

      - name: Install Chrome system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: web
        run: npx playwright install-deps chrome

      # ═══════════════════════════════════════════════════════
      # Resolve target URL:
      #   workflow_dispatch + input → manual URL
      #   pull_request             → Vercel preview (CI-02)
      #   push to main/v2          → production     (CI-01)
      # ═══════════════════════════════════════════════════════
      - name: Validate manual URL
        if: github.event_name == 'workflow_dispatch' && inputs.preview_url != ''
        id: manual
        env:
          INPUT_URL: ${{ inputs.preview_url }}
        run: |
          node <<'NODE'
          const u = new URL(process.env.INPUT_URL);
          if (u.protocol !== 'https:' || !u.hostname.endsWith('.vercel.app') || u.hostname === 'eah-sq.vercel.app') {
            console.error('::error::Manual URL must be HTTPS Vercel Preview (not production)');
            process.exit(1);
          }
          console.log('Manual URL OK: ' + u.toString());
          NODE
          echo "url=$INPUT_URL" >> $GITHUB_OUTPUT

      - name: Wait for Vercel preview (PR only)
        if: github.event_name == 'pull_request'
        id: vercel
        uses: patrickedqvist/wait-for-vercel-preview@06c79330064b0e6ef7a2574603b62d3c98789125 # v1.3.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 300
          check_interval: 10

      - name: Set production URL (push)
        if: github.event_name == 'push'
        id: prod
        run: echo "url=https://eah-sq.vercel.app" >> $GITHUB_OUTPUT

      - name: Compute target URL
        id: target
        env:
          MANUAL_URL: ${{ steps.manual.outputs.url }}
          VERCEL_URL: ${{ steps.vercel.outputs.url }}
          PROD_URL: ${{ steps.prod.outputs.url }}
        run: |
          URL="${MANUAL_URL:-${VERCEL_URL:-${PROD_URL:-}}}"
          if [ -z "$URL" ]; then
            echo "::error::No target URL — Vercel preview not ready or unavailable"
            exit 1
          fi
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "::notice::E2E target = $URL"

      - name: Run E2E
        working-directory: web
        env:
          PLAYWRIGHT_SKIP_SERVER: '1'
          PLAYWRIGHT_BASE_URL: ${{ steps.target.outputs.url }}
        run: npx playwright test --reporter=list,github

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-${{ github.run_id }}
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
