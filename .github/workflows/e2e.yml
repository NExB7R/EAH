name: E2E (isolated QA only)

on:
  workflow_dispatch:

concurrency:
  group: e2e-isolated-qa
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
      SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.QA_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QA_SUPABASE_SERVICE_ROLE_KEY }}
      EAH_QA_ALLOWED_PROJECT_REF: ${{ vars.EAH_QA_ALLOWED_PROJECT_REF }}
      EAH_E2E_ALLOW_NONPROD: 'yes'
      EAH_E2E_PUBLISHED_BUSINESS_SLUG: ${{ vars.EAH_E2E_PUBLISHED_BUSINESS_SLUG }}
      EAH_E2E_DRAFT_BUSINESS_NAME: ${{ vars.EAH_E2E_DRAFT_BUSINESS_NAME }}
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Validate isolated QA configuration
        run: |
          node --input-type=module <<'NODE'
          const required = [
            'NEXT_PUBLIC_SUPABASE_URL',
            'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY',
            'SUPABASE_SERVICE_ROLE_KEY',
            'EAH_QA_ALLOWED_PROJECT_REF',
            'EAH_E2E_PUBLISHED_BUSINESS_SLUG',
            'EAH_E2E_DRAFT_BUSINESS_NAME',
          ];
          const missing = required.filter((key) => !process.env[key]?.trim());
          if (missing.length) {
            console.error('::error::Missing isolated QA configuration: ' + missing.join(', '));
            process.exit(1);
          }

          const url = new URL(process.env.NEXT_PUBLIC_SUPABASE_URL);
          const projectRef = url.hostname.split('.')[0];
          if (
            url.protocol !== 'https:' ||
            projectRef === 'npmpiivmdksdirrumbmt' ||
            projectRef !== process.env.EAH_QA_ALLOWED_PROJECT_REF
          ) {
            console.error('::error::Refusing E2E: Supabase must be the explicitly approved non-production project.');
            process.exit(1);
          }

          if (!/^eah-qa-test-[a-z0-9-]+$/.test(process.env.EAH_E2E_PUBLISHED_BUSINESS_SLUG)) {
            console.error('::error::Published fixture slug must use the eah-qa-test- prefix.');
            process.exit(1);
          }
          console.log('Isolated QA configuration validated.');
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome for Playwright
        run: npx playwright install --with-deps chrome

      - name: Run isolated E2E
        run: npx playwright test --reporter=list,github,html

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: isolated-e2e-report-${{ github.run_id }}
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
