name: E2E

on:
  push:
    branches: [main, v2]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - 'web/scripts/ignore-vercel-build.sh'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - 'web/scripts/ignore-vercel-build.sh'
  workflow_dispatch:
    inputs:
      preview_url:
        description: 'Manual URL override (optional, HTTPS .vercel.app, not production)'
        required: false
        type: string

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: read
      pull-requests: read
      deployments: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # ── Cache Playwright browsers (~150MB) ──
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: ~/.cache/ms-playwright
          key: pw-chrome-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            pw-chrome-${{ runner.os }}-

      - name: Install deps
        working-directory: web
        run: npm ci

      - name: Install Chrome for Playwright
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: npx playwright install --with-deps chrome

      - name: Install Chrome system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: web
        run: npx playwright install-deps chrome

      # ═══════════════════════════════════════════════════════
      # Resolve target URL:
      #   workflow_dispatch + input → manual URL
      #   pull_request             → Vercel preview (CI-02)
      #   push to main/v2          → production     (CI-01)
      # ═══════════════════════════════════════════════════════
      - name: Validate manual URL
        if: github.event_name == 'workflow_dispatch' && inputs.preview_url != ''
        id: manual
        env:
          INPUT_URL: ${{ inputs.preview_url }}
        run: |
          node <<'NODE'
          const u = new URL(process.env.INPUT_URL);
          if (u.protocol !== 'https:' || !u.hostname.endsWith('.vercel.app') || u.hostname === 'eah-sq.vercel.app') {
            console.error('::error::Manual URL must be HTTPS Vercel Preview (not production)');
            process.exit(1);
          }
          console.log('Manual URL OK: ' + u.toString());
          NODE
          echo "url=$INPUT_URL" >> $GITHUB_OUTPUT

      - name: Resolve matching Vercel preview deployment (PR only)
        if: github.event_name == 'pull_request'
        id: vercel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const apiBase = `https://api.github.com/repos/${process.env.REPOSITORY}`;
          const headers = {
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28',
          };

          async function api(path) {
            const response = await fetch(apiBase + path, { headers });
            if (!response.ok) {
              const body = await response.text();
              throw new Error(`GitHub API ${response.status}: ${body.slice(0, 500)}`);
            }
            return response.json();
          }

          function isPreviewDeployment(deployment) {
            const environment = String(deployment.environment ?? '').toLowerCase();
            return environment.includes('preview') && !environment.includes('production');
          }

          function validatePreviewUrl(value) {
            try {
              const url = new URL(value);
              return url.protocol === 'https:' &&
                url.hostname.endsWith('.vercel.app') &&
                url.hostname !== 'eah-sq.vercel.app';
            } catch {
              return false;
            }
          }

          const shas = [...new Set([process.env.PR_HEAD_SHA, process.env.MERGE_SHA].filter(Boolean))];
          const deadline = Date.now() + 5 * 60 * 1000;

          while (Date.now() < deadline) {
            for (const sha of shas) {
              const deployments = await api(`/deployments?sha=${encodeURIComponent(sha)}&per_page=100`);
              const candidates = deployments
                .filter(isPreviewDeployment)
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

              for (const deployment of candidates.slice(0, 2)) {
                // Re-read pending statuses on every poll; do not mark a deployment
                // as seen until its latest status is successful or terminal.
                const statuses = await api(`/deployments/${deployment.id}/statuses?per_page=10`);
                const latest = statuses[0];
                if (!latest) continue;

                if (latest.state === 'success') {
                  const target = latest.environment_url;
                  if (!validatePreviewUrl(target)) {
                    coreNotice(`Ignoring non-preview deployment URL: ${target ?? '(missing)'}`);
                    continue;
                  }
                  console.log(`Preview ready for ${sha.slice(0, 8)} via creator ${deployment.creator?.login ?? 'unknown'}`);
                  console.log(`url=${target}`);
                  require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, `url=${target}\n`);
                  process.exit(0);
                }

                if (['failure', 'error', 'inactive'].includes(latest.state)) {
                  console.log(`Deployment ${deployment.id} status: ${latest.state}`);
                }
              }
            }
            console.log('Waiting for a successful Vercel Preview deployment for the PR commit...');
            await sleep(10000);
          }

          throw new Error('No successful Vercel Preview deployment was found for the PR head or merge commit within 5 minutes.');

          function coreNotice(message) {
            console.log(`::notice::${message}`);
          }
          NODE

      - name: Set production URL (push)
        if: github.event_name == 'push'
        id: prod
        run: echo "url=https://eah-sq.vercel.app" >> $GITHUB_OUTPUT

      - name: Compute target URL
        id: target
        env:
          MANUAL_URL: ${{ steps.manual.outputs.url }}
          VERCEL_URL: ${{ steps.vercel.outputs.url }}
          PROD_URL: ${{ steps.prod.outputs.url }}
        run: |
          URL="${MANUAL_URL:-${VERCEL_URL:-${PROD_URL:-}}}"
          if [ -z "$URL" ]; then
            echo "::error::No target URL — Vercel preview not ready or unavailable"
            exit 1
          fi
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "::notice::E2E target = $URL"

      - name: Run E2E
        working-directory: web
        env:
          PLAYWRIGHT_SKIP_SERVER: '1'
          PLAYWRIGHT_BASE_URL: ${{ steps.target.outputs.url }}
        run: npx playwright test --reporter=list,github

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-${{ github.run_id }}
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
