name: E2E

on:
  push:
    branches: [main, v2]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - 'web/scripts/ignore-vercel-build.sh'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - 'web/scripts/ignore-vercel-build.sh'
  workflow_dispatch:
    inputs:
      preview_url:
        description: 'Manual URL override (optional, HTTPS .vercel.app, not production)'
        required: false
        type: string

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: read
      pull-requests: read
      deployments: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # ── Cache Playwright browsers (~150MB) ──
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: ~/.cache/ms-playwright
          key: pw-chrome-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            pw-chrome-${{ runner.os }}-

      - name: Install deps
        working-directory: web
        run: npm ci

      - name: Install Chrome for Playwright
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: npx playwright install --with-deps chrome

      - name: Install Chrome system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: web
        run: npx playwright install-deps chrome

      # ═══════════════════════════════════════════════════════
      # Resolve target URL:
      #   workflow_dispatch + input → manual URL
      #   pull_request             → Vercel preview (CI-02)
      #   push to main/v2          → production     (CI-01)
      # ═══════════════════════════════════════════════════════
      - name: Validate manual URL
        if: github.event_name == 'workflow_dispatch' && inputs.preview_url != ''
        id: manual
        env:
          INPUT_URL: ${{ inputs.preview_url }}
        run: |
          node <<'NODE'
          const u = new URL(process.env.INPUT_URL);
          if (u.protocol !== 'https:' || !u.hostname.endsWith('.vercel.app') || u.hostname === 'eah-sq.vercel.app') {
            console.error('::error::Manual URL must be HTTPS Vercel Preview (not production)');
            process.exit(1);
          }
          console.log('Manual URL OK: ' + u.toString());
          NODE
          echo "url=$INPUT_URL" >> $GITHUB_OUTPUT

      - name: Resolve matching Vercel preview deployment (PR only)
        if: github.event_name == 'pull_request'
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: prj_Wat1k5gK0vWXRi0n9bMhpQD20j9T
          VERCEL_TEAM_ID: team_UtR0uW1NJ2xDMLQNLB8KTBA4
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
          EXPECTED_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          node <<'NODE'
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const token = process.env.VERCEL_TOKEN;
          if (!token) {
            console.error('::error::VERCEL_TOKEN is required to locate the matching EAH Preview deployment.');
            process.exit(1);
          }

          const shas = [...new Set([process.env.PR_HEAD_SHA, process.env.MERGE_SHA].filter(Boolean))];
          const deadline = Date.now() + 5 * 60 * 1000;
          const headers = { Authorization: `Bearer ${token}`, Accept: 'application/json' };

          async function listForSha(sha) {
            const url = new URL('https://api.vercel.com/v6/deployments');
            url.searchParams.set('projectId', process.env.VERCEL_PROJECT_ID);
            url.searchParams.set('teamId', process.env.VERCEL_TEAM_ID);
            url.searchParams.set('target', 'preview');
            url.searchParams.set('sha', sha);
            url.searchParams.set('limit', '20');

            const response = await fetch(url, { headers });
            if (!response.ok) {
              const body = await response.text();
              throw new Error(`Vercel API ${response.status}: ${body.slice(0, 500)}`);
            }
            const data = await response.json();
            return Array.isArray(data.deployments) ? data.deployments : [];
          }

          function toPreviewUrl(value) {
            try {
              const url = new URL(value.startsWith('https://') ? value : `https://${value}`);
              if (
                url.protocol !== 'https:' ||
                !url.hostname.endsWith('.vercel.app') ||
                url.hostname === 'eah-sq.vercel.app'
              ) return null;
              return url.origin;
            } catch {
              return null;
            }
          }

          while (Date.now() < deadline) {
            for (const sha of shas) {
              const deployments = await listForSha(sha);
              const candidates = deployments
                .filter((deployment) =>
                  deployment.meta?.githubCommitSha === sha &&
                  deployment.meta?.githubCommitRef === process.env.EXPECTED_BRANCH
                )
                .sort((a, b) => (b.created ?? 0) - (a.created ?? 0));

              for (const deployment of candidates) {
                const state = deployment.readyState ?? deployment.state;
                if (state === 'READY' && deployment.url) {
                  const previewUrl = toPreviewUrl(deployment.url);
                  if (!previewUrl) {
                    console.log(`Ignoring invalid/non-preview deployment URL for ${sha.slice(0, 8)}`);
                    continue;
                  }
                  console.log(`Matched Vercel Preview ${deployment.uid ?? deployment.id} for ${sha.slice(0, 8)}`);
                  require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, `url=${previewUrl}\n`);
                  process.exit(0);
                }
                if (['ERROR', 'CANCELED', 'BLOCKED'].includes(state)) {
                  console.log(`Vercel deployment ${deployment.uid ?? deployment.id} reached terminal state ${state}`);
                }
              }
            }
            console.log('Waiting for a READY Vercel Preview matching the exact PR SHA...');
            await sleep(10000);
          }

          throw new Error('No READY Vercel Preview deployment matched the PR head or merge SHA within 5 minutes.');
          NODE

      - name: Set production URL (push)
        if: github.event_name == 'push'
        id: prod
        run: echo "url=https://eah-sq.vercel.app" >> $GITHUB_OUTPUT

      - name: Compute target URL
        id: target
        env:
          MANUAL_URL: ${{ steps.manual.outputs.url }}
          VERCEL_URL: ${{ steps.vercel.outputs.url }}
          PROD_URL: ${{ steps.prod.outputs.url }}
        run: |
          URL="${MANUAL_URL:-${VERCEL_URL:-${PROD_URL:-}}}"
          if [ -z "$URL" ]; then
            echo "::error::No target URL — Vercel preview not ready or unavailable"
            exit 1
          fi
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "::notice::E2E target = $URL"

      - name: Require access to the SSO-protected Preview
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.preview_url != '')
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "::error::The EAH Vercel project protects Preview deployments with SSO. Add the VERCEL_AUTOMATION_BYPASS_SECRET repository Actions secret before running Preview E2E."
            exit 1
          fi

      - name: Run E2E
        working-directory: web
        env:
          PLAYWRIGHT_SKIP_SERVER: '1'
          PLAYWRIGHT_BASE_URL: ${{ steps.target.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npx playwright test --reporter=list,github

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-${{ github.run_id }}
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
