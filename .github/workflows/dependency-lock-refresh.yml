name: Temporary dependency lock refresh

on:
  push:
    branches: [chore/security-dependency-refresh]
    paths:
      - 'web/package.json'
      - '.github/workflows/dependency-lock-refresh.yml'

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Regenerate package lock
        working-directory: web
        run: npm install --package-lock-only --ignore-scripts --no-audit

      - name: Commit lockfile
        shell: bash
        run: |
          if git diff --quiet -- web/package-lock.json; then
            echo "package-lock.json is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json
          git commit -m "chore(deps): regenerate security-patched lockfile"
          git push
