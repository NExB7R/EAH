name: Context Map

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/CONTEXT_MAP.md'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate CONTEXT_MAP.md
        working-directory: web
        run: node scripts/gen-context-map.mjs

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet docs/CONTEXT_MAP.md; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit + push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/CONTEXT_MAP.md
          git commit -m "docs(context-map): auto-regenerate [skip ci]"
          git push
