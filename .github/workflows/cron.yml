name: EAH Cron Jobs

on:
  schedule:
    - cron: '0 * * * *'
    - cron: '0 3 1 * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'الـ job اللي عايز تشغّله'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - hourly
          - trust-decay

jobs:
  hourly-tasks:
    runs-on: ubuntu-latest
    if: |
      github.event.schedule == '0 * * * *' ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'hourly'))
    steps:
      - name: Review reminder
        run: |
          curl -sS -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://eah-sq.vercel.app/api/cron/review-reminder" \
            -w "\nHTTP: %{http_code}\n" --max-time 60

      - name: Subscription check
        run: |
          curl -sS -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://eah-sq.vercel.app/api/cron/subscription-check" \
            -w "\nHTTP: %{http_code}\n" --max-time 60

  monthly-trust-decay:
    runs-on: ubuntu-latest
    if: |
      github.event.schedule == '0 3 1 * *' ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'trust-decay'))
    steps:
      - name: Apply trust decay
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "https://eah-sq.vercel.app/api/cron/trust-decay" \
            -w "\nHTTP: %{http_code}\n" --max-time 60
