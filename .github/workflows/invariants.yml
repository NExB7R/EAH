name: Invariants

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - 'web/scripts/ignore-vercel-build.sh'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - 'web/scripts/ignore-vercel-build.sh'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Verify invariants (strict)
        run: node scripts/verify-invariants.mjs --strict

      - name: Report on failure
        if: failure()
        run: |
          echo "::error::Invariants gate failed. Fix violations before merging."
          node scripts/verify-invariants.mjs --verbose || true
