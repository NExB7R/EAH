name: EAH Quality

on:
  push:
    branches: [ui-onlook]
  pull_request:
    branches: [ui-onlook]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 08-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 08-web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
