name: Quality Gate

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint .

      - name: Prettier
        run: npx prettier --check "**/*.{ts,tsx,css,json}"

      - name: Stylelint (CSS)
        run: npx stylelint "app/**/*.module.css" "components/**/*.module.css"

      - name: Build (webpack)
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: "https://eah-sq.vercel.app"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'placeholder-anon-key' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-key' }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY || '1x00000000000000000000AA' }}

      - name: Unit Tests
        run: npx vitest run --reporter=dot

      - name: npm audit (production only)
        run: npm audit --omit=dev --audit-level=high

      - name: Knip (dead code)
        run: npx knip --include files,dependencies

      - name: jscpd (duplicates)
        run: npx jscpd .

  rls-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: web
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Require non-production database URL
        if: env.SUPABASE_DB_URL == ''
        run: |
          echo "::error::SUPABASE_DB_URL is required; RLS tests must not silently skip. Configure it as a GitHub Actions secret pointing to a dedicated non-production test database."
          exit 1

      - name: Checkout
        if: env.SUPABASE_DB_URL != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        if: env.SUPABASE_DB_URL != ''
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run RLS tests
        if: env.SUPABASE_DB_URL != ''
        run: supabase test db supabase/tests/rls.test.sql supabase/tests/reputation-policy.test.sql supabase/tests/admin-policy-alignment.test.sql --db-url "$SUPABASE_DB_URL"

      - name: Setup PostgreSQL client
        if: env.SUPABASE_DB_URL != ''
        run: sudo apt-get install -y postgresql-client

      - name: RLS Audit (comprehensive)
        if: env.SUPABASE_DB_URL != ''
        run: psql "$SUPABASE_DB_URL" -f supabase/tests/rls-audit.sql
